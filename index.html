<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Mobile Banking</title>
    <!-- DaisyUi CDN-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- css file -->
     <link rel="stylesheet" href="./styles/style.css">
  </head>
  <body class="bg-[#f4f5f7] h-[100vh] flex flex-col justify-center items-center">
    <section class="flex flex-col justify-center items-center">
        <div class="flex justify-center items-center h-[130px] w-[300px] bg-[url(./assets/bg.png)] bg-cover">
            <img class="" src="./assets/Group.png" alt="brand logo">
        </div>
      <form class="w-[350px] bg-white rounded-2xl p-8">
        <!-- Enter Mobile number -->
        <div>
          <label class="font-semibold" for="">Mobile Number</label>
          <br />
          <input 
            id="mobile-number"
            type="text"
            placeholder="Your Number"
            class="input bg-[#f4f5f7] mt-3 rounded-md"
          />
        </div>
        <!-- Pin number -->
        <div class="mt-5">
          <label class="font-semibold" for="">5 Digits Pin</label>
          <br />
          <input
            id="pin-number"
            type="text"
            placeholder="5 Digits Pin"
            class="input bg-[#f4f5f7] mt-3 rounded-md"
          />
        </div>
        <button id="btn-login" type="button"
          class="btn bg-[#0874f2] text-white font-semibold mt-5 w-full rounded-md"
        >
          Login
        </button>
      </form>
    </section>


    <!-- js scripts -->
     <script src="./script.js"></script>
  </body>
</html>
